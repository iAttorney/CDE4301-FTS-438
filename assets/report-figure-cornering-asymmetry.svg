<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <title>Sources of asymmetrical airflow in cornering: the outer side of the car follows a larger radius and meets faster air, the steered front wheels are not mirrored, and body roll gives each side a different ride height</title>
  <rect width="900" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#172333"/>
    </marker>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#66758a"/>
    </marker>
    <marker id="arrFast" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#12396b"/>
    </marker>
    <marker id="arrMid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8f9bab"/>
    </marker>
    <marker id="arrSlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b2182b"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#66758a" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- ============ (a) Top view ============ -->
  <text x="20" y="30" font-size="15" font-weight="bold" fill="#172333">(a) Top view: the outer side follows a larger radius</text>

  <!-- Paths of the outer side, centreline and inner side (corner centre at 270,440) -->
  <path d="M17.2,227.9 A330,330 0 0 1 522.8,227.9" fill="none" stroke="#c8d3df" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M55.5,260.0 A280,280 0 0 1 484.5,260.0" fill="none" stroke="#c8d3df" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M93.8,292.1 A230,230 0 0 1 446.2,292.1" fill="none" stroke="#c8d3df" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Radii -->
  <line x1="270" y1="440" x2="115.1" y2="148.6" stroke="#66758a" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="270" y1="440" x2="128.4" y2="258.8" stroke="#66758a" stroke-width="1.2" stroke-dasharray="3 4"/>
  <circle cx="270" cy="440" r="4" fill="#172333"/>
  <text x="282" y="445" font-size="13" fill="#172333">Corner centre</text>
  <text x="143" y="226" font-size="14" font-style="italic" text-anchor="end" fill="#172333">r<tspan dy="4" font-size="10">outer</tspan></text>
  <text x="176" y="334" font-size="14" font-style="italic" text-anchor="end" fill="#172333">r<tspan dy="4" font-size="10">inner</tspan></text>

  <!-- Oncoming air relative to the car: same angle swept, so arrow length scales with radius -->
  <path d="M490.8,194.8 A330,330 0 0 0 382.9,129.9" fill="none" stroke="#12396b" stroke-width="5" marker-end="url(#arrFast)"/>
  <path d="M457.4,231.9 A280,280 0 0 0 365.8,176.9" fill="none" stroke="#8f9bab" stroke-width="5" marker-end="url(#arrMid)"/>
  <path d="M423.9,269.1 A230,230 0 0 0 348.7,223.9" fill="none" stroke="#b2182b" stroke-width="5" marker-end="url(#arrSlow)"/>
  <text x="500" y="186" font-size="13" font-weight="bold" fill="#12396b">Faster air</text>
  <text x="500" y="203" font-size="13" fill="#12396b">(outer side)</text>
  <text x="436" y="287" font-size="13" font-weight="bold" fill="#b2182b">Slower air</text>
  <text x="436" y="304" font-size="13" fill="#b2182b">(inner side)</text>

  <!-- Car, travelling to the right and turning towards the corner centre -->
  <rect x="195" y="120" width="18" height="80" rx="2" fill="#19558a" stroke="#172333" stroke-width="1.2"/>
  <rect x="333" y="112" width="12" height="96" rx="2" fill="#19558a" stroke="#172333" stroke-width="1.2"/>
  <path d="M213,145 L300,145 L338,154 L338,166 L300,175 L213,175 Z" fill="#dfe6ee" stroke="#172333" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="262" cy="160" rx="14" ry="8" fill="#ffffff" stroke="#172333" stroke-width="1.2"/>
  <line x1="237" y1="124" x2="237" y2="196" stroke="#172333" stroke-width="1.5"/>
  <line x1="310" y1="124" x2="310" y2="196" stroke="#172333" stroke-width="1.5"/>
  <rect x="222" y="110" width="30" height="14" rx="3" fill="#172333"/>
  <rect x="222" y="196" width="30" height="14" rx="3" fill="#172333"/>
  <rect x="295" y="110" width="30" height="14" rx="3" fill="#172333" transform="rotate(14 310 117)"/>
  <rect x="295" y="196" width="30" height="14" rx="3" fill="#172333" transform="rotate(14 310 203)"/>

  <line x1="222" y1="92" x2="318" y2="92" stroke="#172333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="82" font-size="13" text-anchor="middle" fill="#172333">Direction of travel</text>

  <!-- Steered-wheel callout -->
  <line x1="322" y1="318" x2="313" y2="216" stroke="#66758a" stroke-width="1.2" marker-end="url(#arrM)"/>
  <text x="300" y="336" font-size="13" font-weight="bold" fill="#172333">Steered front wheels</text>
  <text x="300" y="353" font-size="13" fill="#172333">are no longer mirrored</text>

  <text x="20" y="468" font-size="13" fill="#66758a">Both sides turn at the same rate, so speed rises in proportion to radius.</text>

  <!-- ============ divider ============ -->
  <line x1="610" y1="16" x2="610" y2="464" stroke="#c8d3df" stroke-width="1"/>

  <!-- ============ (b) Rear view ============ -->
  <text x="628" y="30" font-size="15" font-weight="bold" fill="#172333">(b) Rear view: body roll</text>

  <text x="760" y="92" font-size="13" text-anchor="middle" fill="#172333">Body rolls towards the</text>
  <text x="760" y="109" font-size="13" text-anchor="middle" fill="#172333">outside of the corner</text>
  <path d="M800,150 A70,70 0 0 0 720,150" fill="none" stroke="#172333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Ground -->
  <rect x="630" y="330" width="260" height="12" fill="url(#hatch)"/>
  <line x1="630" y1="330" x2="890" y2="330" stroke="#172333" stroke-width="1.5"/>

  <!-- Suspension links and wheels (stay on the ground) -->
  <line x1="678" y1="300" x2="745" y2="282" stroke="#172333" stroke-width="1.5"/>
  <line x1="842" y1="300" x2="775" y2="278" stroke="#172333" stroke-width="1.5"/>
  <rect x="652" y="270" width="26" height="60" rx="5" fill="#172333"/>
  <rect x="842" y="270" width="26" height="60" rx="5" fill="#172333"/>

  <!-- Sprung body, rolled 6 degrees about the floor centre (exaggerated) -->
  <g transform="rotate(-6 760 304)">
    <line x1="745" y1="238" x2="745" y2="204" stroke="#172333" stroke-width="1.5"/>
    <line x1="775" y1="238" x2="775" y2="204" stroke="#172333" stroke-width="1.5"/>
    <rect x="700" y="194" width="120" height="10" rx="2" fill="#19558a" stroke="#172333" stroke-width="1.2"/>
    <rect x="695" y="184" width="6" height="52" rx="1" fill="#19558a" stroke="#172333" stroke-width="1.2"/>
    <rect x="819" y="184" width="6" height="52" rx="1" fill="#19558a" stroke="#172333" stroke-width="1.2"/>
    <rect x="730" y="236" width="60" height="64" rx="8" fill="#dfe6ee" stroke="#172333" stroke-width="1.5"/>
    <rect x="684" y="299" width="152" height="8" rx="2" fill="#19558a" stroke="#172333" stroke-width="1.2"/>
  </g>

  <!-- Ride-height gaps -->
  <line x1="690" y1="315" x2="690" y2="330" stroke="#b2182b" stroke-width="4"/>
  <line x1="830" y1="300" x2="830" y2="330" stroke="#b2182b" stroke-width="4"/>

  <text x="695" y="364" font-size="13" font-weight="bold" text-anchor="middle" fill="#172333">Outer side</text>
  <text x="695" y="381" font-size="13" text-anchor="middle" fill="#172333">lower ride height</text>
  <text x="825" y="364" font-size="13" font-weight="bold" text-anchor="middle" fill="#172333">Inner side</text>
  <text x="825" y="381" font-size="13" text-anchor="middle" fill="#172333">higher ride height</text>

  <line x1="770" y1="420" x2="850" y2="420" stroke="#66758a" stroke-width="1.5" marker-end="url(#arrM)"/>
  <text x="762" y="424" font-size="13" text-anchor="end" fill="#66758a">To corner centre</text>

  <text x="888" y="468" font-size="12" text-anchor="end" fill="#66758a">Schematic, not to scale</text>
</svg>
